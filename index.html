<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pencarian data pemilih berdasarkan nama.">
  <title>DAFTAR PEMILIH SEMENTARA (DPS) - Desa Mendelem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="search-card" aria-labelledby="page-title">
      <div class="heading">
        <p class="eyebrow">DAFTAR PEMILIH SEMENTARA (DPS)</p>
        <h1 id="page-title">
          PEMILIHAN KEPALA DESA<br>
          <span>DESA MENDELEM KECAMATAN BELIK TAHUN 2026</span>
        </h1>
        <p class="subtitle">Masukkan nama untuk mencari data pemilih.</p>
      </div>

      <form id="searchForm" class="search-form" role="search">
        <label class="sr-only" for="searchInput">Nama pemilih</label>
        <input
          id="searchInput"
          name="q"
          type="search"
          placeholder="Ketik nama pemilih..."
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="search"
        >
        <button type="submit" id="searchButton">Cari</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="results" class="results"></div>
    </section>
  </main>

  

  <script src="script.js"></script>
</body>
</html>
